brov_obs_node:
  ros__parameters:
    # Feedback-source A/B mission: preserve Case-A's three-point guidance while
    # removing camera/localization from the estimator-causality experiment.
    # idx sequence for one complete cycle is 0 -> 1 -> 2 -> 1.
    waypoints: "0,0,0;0,0,0.20;2.0,0,0.20"
    waypoint_frame: "start_heading"
    heading_mode: "takeoff_then_align"
    loop: true

    cruise_speed: 0.50
    lookahead_dist: 0.40
    reach_threshold: 0.15
    depth_hold_kp: 0.8
    depth_speed_limit: 0.05
    terminal_hold_kp: 0.5
    terminal_speed_limit: 0.05

    waypoint_bounds_enabled: true
    waypoint_min_xyz: [0.0, 0.0, 0.0]
    waypoint_max_xyz: [2.0, 0.0, 0.20]
